[project]
name = "bizpulse-platform"
version = "0.1.0"
description = "Domain-agnostic decision intelligence platform: ingestion, data contracts, DuckDB star schema, BI, forecasting, anomaly detection and what-if simulation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Omar Hazem", email = "OmarHazem123@users.noreply.github.com" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "duckdb>=1.1,<2",
  "lightgbm>=4.3,<5",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "plotly>=5.22,<7",
  "pyarrow>=16",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.38,<2",
]

[project.scripts]
bizpulse = "bizpulse.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-openpyxl>=3.1",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bizpulse"]

[tool.hatch.build.targets.sdist]
include = ["src/bizpulse", "config", "README.md", "LICENSE"]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "SIM",  # simplify
  "C4",   # comprehensions
  "RUF",  # ruff-specific
  "PTH",  # use pathlib
  "S",    # bandit (security)
  "DTZ",  # timezone-naive datetime calls
  "T20",  # no stray print()
]
ignore = [
  "S608",  # SQL built from vetted identifiers only (see warehouse/schema.py)
]

[tool.ruff.lint.isort]
known-first-party = ["bizpulse", "tasks"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "DTZ001"]  # naive datetimes = the warehouse's naive-UTC convention
"tasks.py" = ["T201", "S603", "S607"]
"src/bizpulse/cli.py" = ["T201"]
"src/bizpulse/demo/**" = ["S311"]

[tool.ruff.format]
line-ending = "lf"

# --------------------------------------------------------------------------
# Mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "tasks.py"]
mypy_path = "src"
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "lightgbm.*", "plotly.*", "pyarrow.*", "scipy.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: end-to-end tests that touch the filesystem and DuckDB",
  "slow: tests that take more than a few seconds",
]
filterwarnings = [
  "error::pandas.errors.SettingWithCopyWarning",
  "error::DeprecationWarning:bizpulse.*",
  "error::FutureWarning:bizpulse.*",
]

[tool.coverage.run]
source = ["bizpulse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
